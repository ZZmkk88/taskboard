<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskboard · 项目看板</title>
<style>
  :root{
    --ink:#1c2733; --ink2:#5a6b7c; --line:#d8dee5;
    --bg:#eef1f4; --panel:#e3e8ee; --card:#ffffff;
    --accent:#0e7c86; --accent-dark:#0a5f66;
    --danger:#c0392b; --amber:#b7791f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px}
  button:hover{border-color:var(--accent);color:var(--accent-dark)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-dark);color:#fff}
  button.ghost{border-color:transparent;background:transparent}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  input,textarea,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
  .hidden{display:none!important}

  /* login */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#123a40,#0e7c86)}
  .loginBox{background:#fff;border-radius:16px;padding:34px 36px;width:min(92vw,360px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .loginBox h1{margin:0 0 4px;font-size:24px}
  .loginBox p{margin:0 0 14px;color:var(--ink2);font-size:13px}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

  /* header */
  header{background:#16222c;color:#eaf1f5;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  header .logo{font-weight:700;font-size:18px;letter-spacing:.4px}
  header .logo span{color:#39c2cd}
  #boardTabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .tab{background:transparent;border:1px solid #39505f;color:#cfe0e8;border-radius:999px;padding:5px 14px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  header button{background:transparent;border-color:#39505f;color:#cfe0e8}
  header button:hover{border-color:#39c2cd;color:#fff}

  /* board */
  #boardBar{display:flex;align-items:center;gap:8px;padding:12px 18px 0}
  #boardBar h2{margin:0;font-size:19px}
  #boardBar .spacer{flex:1}
  #columns{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:14px 18px 22px;min-height:60vh}
  .col{background:var(--panel);border-radius:14px;width:288px;flex:0 0 288px;padding:10px 10px 12px}
  .colHead{display:flex;align-items:center;gap:4px;padding:2px 4px 8px}
  .colHead .t{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .colHead .cnt{background:#fff;border-radius:999px;font-size:12px;color:var(--ink2);padding:1px 8px}
  .colHead button{padding:2px 7px;font-size:12px}
  .cardList{display:flex;flex-direction:column;gap:8px;min-height:12px}
  .card{background:var(--card);border-radius:10px;padding:10px 11px;box-shadow:0 1px 3px rgba(20,35,50,.13);cursor:grab}
  .card.dragging{opacity:.45}
  .card .ttl{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
  .card .dsc{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .chip{font-size:11.5px;border-radius:999px;padding:1.5px 8px;color:#fff}
  .due{font-size:11.5px;border-radius:999px;padding:1.5px 8px;background:#eef1f4;color:var(--ink2);border:1px solid var(--line)}
  .due.today{color:var(--amber);border-color:var(--amber)}
  .due.overdue{color:#fff;background:var(--danger);border-color:var(--danger)}
  .card .ops{display:flex;gap:3px;margin-top:8px}
  .card .ops button{padding:1px 7px;font-size:12px;color:var(--ink2)}
  .addCard{width:100%;margin-top:9px;background:transparent;border-style:dashed;color:var(--ink2)}
  .dropHint{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:10px}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(15,25,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:7vh 14px 20px;z-index:50}
  .modal{background:#fff;border-radius:14px;width:min(94vw,480px);padding:20px 22px;max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 6px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .colorRow{display:flex;gap:7px;margin-top:4px}
  .cdot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0}
  .cdot.sel{border-color:var(--ink)}
  .archItem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;display:flex;gap:8px;align-items:center}
  .archItem .t{flex:1;font-size:14px}
  .archItem .c{font-size:12px;color:var(--ink2)}
  .empty{color:var(--ink2);font-size:13px;padding:16px 6px;text-align:center}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16222c;color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  #toast.show{opacity:.94}
  @media (max-width:640px){ .col{width:82vw;flex-basis:82vw} }
</style>
</head>
<body>

<div id="loginView">
  <form class="loginBox" id="loginForm">
    <h1>taskboard</h1>
    <p>项目看板 · 登录后开始整理你的卡片</p>
    <label>用户名</label>
    <input id="loginUser" autocomplete="username" required>
    <label>密码</label>
    <input id="loginPass" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="primary" style="width:100%;padding:9px" type="submit">登录</button>
  </form>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="logo">task<span>board</span></div>
    <div id="boardTabs"></div>
    <button id="btnNewBoard">＋ 新看板</button>
    <button id="btnArchived">归档箱</button>
    <button id="btnPwd">改密码</button>
    <button id="btnLogout">退出</button>
  </header>
  <div id="boardBar">
    <h2 id="boardTitle">（暂无看板）</h2>
    <button id="btnRenameBoard" class="ghost">✎ 改名</button>
    <button id="btnDeleteBoard" class="ghost danger">删除看板</button>
    <div class="spacer"></div>
    <button id="btnAddColumn">＋ 加一列</button>
  </div>
  <div id="columns"></div>
  <div id="noBoard" class="empty hidden">还没有看板，点右上角「＋ 新看板」建第一个吧。</div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";
const TAG_COLORS = {gray:"#6b7280",red:"#dc2626",orange:"#ea580c",yellow:"#ca8a04",green:"#16a34a",blue:"#2563eb",purple:"#7c3aed",pink:"#db2777"};
let token = localStorage.getItem("tb_token") || "";
let boards = [];
let current = null;       // current board detail (with columns+cards)
let editingCard = null;   // card object being edited
let editingColor = "blue";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)}
async function api(path, opts={}){
  const res = await fetch(path, {headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, ...opts});
  if(res.status===401 && token){ logoutLocal(); throw new Error("登录已过期"); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail || ("请求失败 "+res.status));
  return data;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});
const put=(p,b)=>api(p,{method:"PUT",body:JSON.stringify(b||{})});
const del=p=>api(p,{method:"DELETE"});

/* ---------------- auth ---------------- */
function logoutLocal(){ token=""; localStorage.removeItem("tb_token"); document.getElementById("appView").classList.add("hidden"); document.getElementById("loginView").classList.remove("hidden"); }
document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const err=document.getElementById("loginErr"); err.textContent="";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("loginUser").value,password:document.getElementById("loginPass").value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"登录失败");
    token=d.token; localStorage.setItem("tb_token",token);
    if(d.must_change_password) toast("首次登录，请点右上角「改密码」修改默认密码");
    await enterApp();
  }catch(ex){ err.textContent=ex.message; }
});
document.getElementById("btnLogout").addEventListener("click", async ()=>{ try{await post("/api/logout")}catch(e){} logoutLocal(); });
document.getElementById("btnPwd").addEventListener("click", ()=>{
  openModal(`<h3>修改密码</h3>
    <label>旧密码</label><input id="pwdOld" type="password">
    <label>新密码（至少 6 位）</label><input id="pwdNew" type="password">
    <div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="pwdSave">保存</button></div>`);
  document.getElementById("pwdSave").onclick=async()=>{
    try{ await post("/api/change-password",{old_password:val("pwdOld"),new_password:val("pwdNew")}); closeModal(); toast("密码已修改"); }
    catch(ex){ toast(ex.message); }
  };
});

/* ---------------- modal helpers ---------------- */
function val(id){return document.getElementById(id).value}
function openModal(html){ document.getElementById("modalRoot").innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

/* ---------------- boards ---------------- */
async function enterApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  await loadBoards();
}
async function loadBoards(keepId){
  boards = await api("/api/boards");
  renderTabs();
  const target = keepId || (current&&current.id) || (boards[0]&&boards[0].id);
  if(target && boards.some(b=>b.id===target)) await selectBoard(target);
  else if(boards.length) await selectBoard(boards[0].id);
  else { current=null; renderBoard(); }
}
function renderTabs(){
  const box=document.getElementById("boardTabs");
  box.innerHTML = boards.map(b=>`<button class="tab ${current&&b.id===current.id?"active":""}" data-board="${b.id}">${esc(b.name)}</button>`).join("");
  box.querySelectorAll("[data-board]").forEach(el=>el.onclick=()=>selectBoard(+el.dataset.board));
}
async function selectBoard(id){
  current = await api("/api/boards/"+id);
  renderTabs(); renderBoard();
}
document.getElementById("btnNewBoard").addEventListener("click", ()=>{
  openModal(`<h3>新建看板</h3><label>看板名</label><input id="nbName" placeholder="例如：产品上线计划">
    <div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="nbSave">创建</button></div>`);
  document.getElementById("nbSave").onclick=async()=>{
    try{ const b=await post("/api/boards",{name:val("nbName")}); closeModal(); await loadBoards(b.id); toast("看板已创建，自带待办/进行中/已完成三列"); }
    catch(ex){ toast(ex.message); }
  };
});
document.getElementById("btnRenameBoard").addEventListener("click", ()=>{
  if(!current) return;
  openModal(`<h3>看板改名</h3><label>新名字</label><input id="rbName" value="${esc(current.name)}">
    <div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="rbSave">保存</button></div>`);
  document.getElementById("rbSave").onclick=async()=>{
    try{ await put("/api/boards/"+current.id,{name:val("rbName")}); closeModal(); await loadBoards(current.id); }
    catch(ex){ toast(ex.message); }
  };
});
document.getElementById("btnDeleteBoard").addEventListener("click", async ()=>{
  if(!current) return;
  if(!confirm(`确定删除看板「${current.name}」吗？里面的列和卡片会一起删掉。`)) return;
  try{ await del("/api/boards/"+current.id); current=null; await loadBoards(); toast("看板已删除"); }
  catch(ex){ toast(ex.message); }
});
document.getElementById("btnAddColumn").addEventListener("click", ()=>{
  if(!current) return;
  openModal(`<h3>加一列</h3><label>列名</label><input id="ncTitle" placeholder="例如：待评审">
    <div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="ncSave">添加</button></div>`);
  document.getElementById("ncSave").onclick=async()=>{
    try{ await post(`/api/boards/${current.id}/columns`,{title:val("ncTitle")}); closeModal(); await selectBoard(current.id); }
    catch(ex){ toast(ex.message); }
  };
});

/* ---------------- board rendering ---------------- */
function dueChip(card){
  if(!card.due_date) return "";
  const today = new Date().toISOString().slice(0,10);
  let cls="due", label="📅 "+card.due_date.slice(5);
  if(card.due_date<today){ cls+=" overdue"; label="⚠ 已逾期 "+card.due_date.slice(5); }
  else if(card.due_date===today){ cls+=" today"; label="📅 今天到期"; }
  return `<span class="${cls}">${label}</span>`;
}
function cardHtml(card, ci){
  const tag = card.tag ? `<span class="chip" style="background:${TAG_COLORS[card.tag_color]||TAG_COLORS.blue}">${esc(card.tag)}</span>` : "";
  const dsc = card.description ? `<div class="dsc">${esc(card.description.length>90?card.description.slice(0,90)+"…":card.description)}</div>` : "";
  return `<div class="card" draggable="true" data-card="${card.id}" data-col="${card.column_id}">
    <div class="ttl">${esc(card.title)}</div>${dsc}
    <div class="meta">${tag}${dueChip(card)}</div>
    <div class="ops">
      <button data-act="left" title="移到上一列">◀</button>
      <button data-act="up" title="在本列上移">↑</button>
      <button data-act="down" title="在本列下移">↓</button>
      <button data-act="right" title="移到下一列">▶</button>
      <span style="flex:1"></span>
      <button data-act="edit">编辑</button>
      <button data-act="archive">归档</button>
    </div></div>`;
}
function renderBoard(){
  const has = !!current;
  document.getElementById("noBoard").classList.toggle("hidden", has);
  document.getElementById("boardBar").style.display = has?"flex":"none";
  document.getElementById("boardTitle").textContent = has? current.name : "（暂无看板）";
  const wrap=document.getElementById("columns");
  if(!has){ wrap.innerHTML=""; return; }
  wrap.innerHTML = current.columns.map((col,ci)=>`
    <section class="col" data-col="${col.id}">
      <div class="colHead">
        <span class="t">${esc(col.title)}</span><span class="cnt">${col.cards.length}</span>
        <button data-cact="left" title="列左移">◀</button>
        <button data-cact="right" title="列右移">▶</button>
        <button data-cact="rename">✎</button>
        <button data-cact="del" class="danger">✕</button>
      </div>
      <div class="cardList" data-list="${col.id}">${col.cards.map(c=>cardHtml(c,ci)).join("")}</div>
      <button class="addCard" data-add="${col.id}">＋ 添加卡片</button>
    </section>`).join("");
  bindBoardEvents();
}
function bindBoardEvents(){
  const wrap=document.getElementById("columns");
  wrap.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openCardEditor(null,+b.dataset.add));
  wrap.querySelectorAll(".col").forEach(colEl=>{
    const colId=+colEl.dataset.col;
    colEl.querySelectorAll("[data-cact]").forEach(btn=>btn.onclick=()=>columnAction(colId,btn.dataset.cact));
    const list=colEl.querySelector(".cardList");
    list.addEventListener("dragover",e=>{ e.preventDefault(); colEl.classList.add("dropHint"); });
    list.addEventListener("dragleave",()=>colEl.classList.remove("dropHint"));
    list.addEventListener("drop",async e=>{
      e.preventDefault(); colEl.classList.remove("dropHint");
      const cardId=+e.dataTransfer.getData("text/plain");
      if(!cardId) return;
      const siblings=[...list.querySelectorAll(".card:not(.dragging)")];
      const after=siblings.find(el=>{ const r=el.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
      const idx = after? siblings.indexOf(after) : siblings.length;
      await doMove(cardId,colId,idx);
    });
  });
  wrap.querySelectorAll(".card").forEach(cardEl=>{
    const cardId=+cardEl.dataset.card;
    cardEl.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",String(cardId)); cardEl.classList.add("dragging"); });
    cardEl.addEventListener("dragend",()=>cardEl.classList.remove("dragging"));
    cardEl.querySelectorAll("[data-act]").forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); cardAction(cardId,btn.dataset.act); });
    cardEl.addEventListener("dblclick",()=>{ const c=findCard(cardId); if(c) openCardEditor(c,c.column_id); });
  });
}
function findCard(id){ if(!current) return null; for(const col of current.columns){ const c=col.cards.find(k=>k.id===id); if(c) return c; } return null; }
function findCol(id){ return current? current.columns.find(c=>c.id===id) : null; }
async function refresh(){ if(current) await selectBoard(current.id); }
async function doMove(cardId,toColId,toIndex){
  try{ await post(`/api/cards/${cardId}/move`,{to_column_id:toColId,to_index:toIndex}); await refresh(); }
  catch(ex){ toast(ex.message); await refresh(); }
}
async function cardAction(cardId,act){
  const card=findCard(cardId); if(!card) return;
  const ci=current.columns.findIndex(c=>c.id===card.column_id);
  const col=current.columns[ci];
  const idx=col.cards.findIndex(k=>k.id===cardId);
  if(act==="edit") openCardEditor(card,card.column_id);
  else if(act==="archive"){ try{ await post(`/api/cards/${cardId}/archive`); await refresh(); toast("已归档"); }catch(ex){ toast(ex.message); } }
  else if(act==="left"){ const t=current.columns[ci-1]; if(t) await doMove(cardId,t.id,9999); else toast("已经是最左边的列了"); }
  else if(act==="right"){ const t=current.columns[ci+1]; if(t) await doMove(cardId,t.id,9999); else toast("已经是最右边的列了"); }
  else if(act==="up"){ if(idx>0) await doMove(cardId,card.column_id,idx-1); }
  else if(act==="down"){ if(idx<col.cards.length-1) await doMove(cardId,card.column_id,idx+1); }
}
async function columnAction(colId,act){
  const ci=current.columns.findIndex(c=>c.id===colId); const col=current.columns[ci];
  if(act==="rename"){
    openModal(`<h3>列改名</h3><label>新名字</label><input id="rcTitle" value="${esc(col.title)}">
      <div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="rcSave">保存</button></div>`);
    document.getElementById("rcSave").onclick=async()=>{
      try{ await put("/api/columns/"+colId,{title:val("rcTitle")}); closeModal(); await refresh(); }catch(ex){ toast(ex.message); }
    };
  } else if(act==="del"){
    if(!confirm(`确定删除列「${col.title}」吗？列里的 ${col.cards.length} 张卡片会一起删掉。`)) return;
    try{ await del("/api/columns/"+colId); await refresh(); toast("列已删除"); }catch(ex){ toast(ex.message); }
  } else if(act==="left"||act==="right"){
    const j = act==="left"? ci-1 : ci+1;
    if(j<0||j>=current.columns.length) return;
    const ids=current.columns.map(c=>c.id);
    [ids[ci],ids[j]]=[ids[j],ids[ci]];
    try{ await post(`/api/boards/${current.id}/columns/reorder`,{column_ids:ids}); await refresh(); }catch(ex){ toast(ex.message); }
  }
}

/* ---------------- card editor ---------------- */
function colorDotsHtml(){
  return Object.entries(TAG_COLORS).map(([name,hex])=>`<button type="button" class="cdot ${name===editingColor?"sel":""}" data-color="${name}" style="background:${hex}" title="${name}"></button>`).join("");
}
function openCardEditor(card,columnId){
  editingCard=card; editingColor=card? (card.tag_color||"blue") : "blue";
  openModal(`<h3>${card?"编辑卡片":"新建卡片"}</h3>
    <label>标题</label><input id="ceTitle" value="${card?esc(card.title):""}" placeholder="要做的事">
    <label>描述（可空）</label><textarea id="ceDesc">${card?esc(card.description):""}</textarea>
    <label>标签（可空）</label><input id="ceTag" value="${card?esc(card.tag):""}" placeholder="例如：紧急、设计、采购">
    <label>标签颜色</label><div class="colorRow" id="ceColors">${colorDotsHtml()}</div>
    <label>截止日期（可空）</label><input id="ceDue" type="date" value="${card?esc(card.due_date):""}">
    <div class="row">
      ${card?`<button class="danger" id="ceDel">删除</button><button id="ceArch">归档</button>`:""}
      <button onclick="closeModal()">取消</button><button class="primary" id="ceSave">保存</button>
    </div>`);
  document.getElementById("ceColors").querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{
    editingColor=b.dataset.color;
    document.getElementById("ceColors").querySelectorAll(".cdot").forEach(x=>x.classList.toggle("sel",x.dataset.color===editingColor));
  });
  document.getElementById("ceSave").onclick=async()=>{
    const body={title:val("ceTitle"),description:val("ceDesc"),tag:val("ceTag"),tag_color:editingColor,due_date:val("ceDue")};
    try{
      if(card) await put("/api/cards/"+card.id,body);
      else await post("/api/columns/"+columnId+"/cards",body);
      closeModal(); await refresh();
    }catch(ex){ toast(ex.message); }
  };
  if(card){
    document.getElementById("ceDel").onclick=async()=>{ if(!confirm("确定删除这张卡片吗？")) return; try{ await del("/api/cards/"+card.id); closeModal(); await refresh(); }catch(ex){ toast(ex.message); } };
    document.getElementById("ceArch").onclick=async()=>{ try{ await post(`/api/cards/${card.id}/archive`); closeModal(); await refresh(); toast("已归档"); }catch(ex){ toast(ex.message); } };
  }
}

/* ---------------- archive box ---------------- */
document.getElementById("btnArchived").addEventListener("click", async ()=>{
  if(!current){ toast("先选一个看板"); return; }
  let items=[];
  try{ items=await api(`/api/boards/${current.id}/archived`); }catch(ex){ toast(ex.message); return; }
  openModal(`<h3>归档箱 · ${esc(current.name)}</h3>
    ${items.length? items.map(k=>`<div class="archItem"><div class="t">${esc(k.title)}<div class="c">原列：${esc(k.column_title)} · 归档于 ${esc((k.updated_at||"").slice(0,10))}</div></div>
      <button data-restore="${k.id}">恢复</button><button class="danger" data-adel="${k.id}">删除</button></div>`).join("")
      : `<div class="empty">归档箱是空的</div>`}
    <div class="row"><button onclick="closeModal()">关闭</button></div>`);
  document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{
    try{ await post(`/api/cards/${b.dataset.restore}/restore`); closeModal(); await refresh(); toast("已恢复到原列末尾"); }catch(ex){ toast(ex.message); }
  });
  document.querySelectorAll("[data-adel]").forEach(b=>b.onclick=async()=>{
    if(!confirm("确定彻底删除这张已归档卡片吗？")) return;
    try{ await del(`/api/cards/${b.dataset.adel}`); closeModal(); document.getElementById("btnArchived").click(); }catch(ex){ toast(ex.message); }
  });
});

/* ---------------- boot ---------------- */
(async()=>{ if(token){ try{ await api("/api/me"); await enterApp(); }catch(e){ logoutLocal(); } } })();
</script>
</body>
</html>
